<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320">
<defs>
  <radialGradient id="body" cx=".38" cy=".35" r=".75">
    <stop offset="0" stop-color="#fde7ff"/><stop offset=".35" stop-color="#c9a7ff"/>
    <stop offset=".7" stop-color="#7f8cff"/><stop offset="1" stop-color="#3a3f8f"/></radialGradient>
  <linearGradient id="ring" x1="0" x2="1">
    <stop offset="0" stop-color="#ff3b5c"/><stop offset=".2" stop-color="#ff8a1f"/><stop offset=".4" stop-color="#ffd84d"/>
    <stop offset=".6" stop-color="#5ce1e6"/><stop offset=".8" stop-color="#3a6bff"/><stop offset="1" stop-color="#9b5cff"/></linearGradient>
  <linearGradient id="leaf" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#2fbf71"/><stop offset="1" stop-color="#b9f6a0"/></linearGradient>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7"/></filter>
  <clipPath id="back"><rect x="0" y="0" width="320" height="160"/></clipPath>
  <clipPath id="front"><rect x="0" y="160" width="320" height="160"/></clipPath>
</defs>
<g transform="rotate(-28 160 160)">
  <g clip-path="url(#back)">
    <ellipse cx="160" cy="160" rx="140" ry="34" fill="none" stroke="url(#ring)" stroke-width="16" opacity=".55" filter="url(#glow)"/>
    <ellipse cx="160" cy="160" rx="140" ry="34" fill="none" stroke="url(#ring)" stroke-width="7"/>
  </g>
</g>
<circle cx="160" cy="160" r="78" fill="url(#body)"/>
<circle cx="160" cy="160" r="78" fill="none" stroke="#fff" stroke-opacity=".25" stroke-width="1.5"/>
<g transform="rotate(-28 160 160)">
  <g clip-path="url(#front)">
    <ellipse cx="160" cy="160" rx="140" ry="34" fill="none" stroke="url(#ring)" stroke-width="16" opacity=".55" filter="url(#glow)"/>
    <ellipse cx="160" cy="160" rx="140" ry="34" fill="none" stroke="url(#ring)" stroke-width="7"/>
  </g>
</g>
<g transform="translate(160 84)">
  <path d="M0 0 C 0 -12, 0 -20, 0 -30" stroke="#2fbf71" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <path d="M0 -22 C -22 -26, -30 -44, -26 -54 C -10 -50, -2 -38, 0 -22 Z" fill="url(#leaf)"/>
  <path d="M0 -28 C 18 -34, 30 -50, 28 -60 C 12 -58, 2 -46, 0 -28 Z" fill="url(#leaf)"/>
  <animateTransform attributeName="transform" type="rotate" values="-4 0 0;4 0 0;-4 0 0" additive="sum" dur="5s" repeatCount="indefinite"/>
